<style>
:root{--purple:#7C3AED;--purple-light:#A78BFA;--purple-pale:#EDE9FE;--pink:#EC4899;--pink-light:#FBCFE8;--yellow:#FCD34D;--bg:#FAF5FF;--white:#fff;--dark:#1E1B4B;--radius:18px;--radius-lg:28px;--radius-xl:40px;--shadow:0 8px 32px rgba(124,58,237,.15);--shadow-hover:0 20px 48px rgba(124,58,237,.28);--font-display:'Fredoka One',cursive;--font-body:'Nunito',sans-serif;}
html[lang=ar]{--font-display:'Tajawal','Cairo',sans-serif;--font-body:'Tajawal','Cairo',sans-serif;}
*{box-sizing:border-box;margin:0;padding:0;}html{scroll-behavior:smooth;}
body{font-family:var(--font-body);background:var(--bg);color:var(--dark);overflow-x:hidden;}
#ticker-bar{background:#ffffff;color:var(--dark);padding:10px 0;overflow:hidden;white-space:nowrap;position:fixed;top:0;left:0;right:0;z-index:1000;border-bottom:2px solid var(--purple-pale);}
.ticker-track{display:inline-flex;gap:0;animation:ticker 28s linear infinite;width:max-content;}
@keyframes ticker{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.ticker-item{display:inline-flex;align-items:center;gap:10px;padding:0 32px;font-weight:800;font-size:.85rem;letter-spacing:.02em;}
#header{position:fixed;top:42px;left:0;right:0;z-index:999;padding:12px 0;transition:all .3s ease;background:rgba(255,255,255,0.95);backdrop-filter:blur(10px);}
.header-inner{max-width:1200px;margin:0 auto;padding:0 20px;display:flex;align-items:center;justify-content:space-between;gap:16px;}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;}
.logo-icon{width:52px;height:52px;background:#fff;border-radius:14px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(124,58,237,.3);position:relative;border: 2px solid var(--purple-pale); padding: 2px;}
.logo-icon img {width: 100%; height: 100%; object-fit: contain; border-radius: 12px;}
.logo-text{font-family:var(--font-display);font-size:1.6rem;line-height:1;}
.logo-text span:first-child{color:var(--purple);}
.logo-text span:last-child{color:var(--pink);}
nav{display:flex;align-items:center;gap:24px;}
nav a{font-weight:700;color:var(--purple);text-decoration:none;transition:color .2s;}
.lang-switcher{display:flex;background:#ede9fe;border-radius:99px;padding:3px;gap:2px;}
.lang-btn{padding:5px 12px;border-radius:99px;border:none;font-family:var(--font-body);font-weight:700;font-size:.8rem;cursor:pointer;transition:all .25s ease;color:#7c3aed;background:transparent;}
.lang-btn.active{background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.1);color:var(--purple);}

#hero{min-height:100vh;background:linear-gradient(135deg,#f5f3ff 0%,#fdf2f8 50%,#fefce8 100%);display:flex;align-items:center;padding:180px 20px 60px;position:relative;overflow:hidden;}
.hero-inner{max-width:1200px;margin:0 auto;width:100%;display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:center;position:relative;z-index:1;}
.hero-title{font-family:var(--font-display);font-size:clamp(2.8rem,5vw,4.2rem);line-height:1.1;color:#1e1b4b;margin-bottom:18px;}
.hero-title .highlight{background:linear-gradient(135deg,var(--purple),var(--pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.btn-primary{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(135deg,var(--purple),var(--pink));color:#fff;font-weight:800;font-size:1rem;padding:14px 28px;border-radius:var(--radius);border:none;cursor:pointer;text-decoration:none;box-shadow:var(--shadow);transition:all .3s ease;}

.section{padding:80px 20px;}
.section-inner{max-width:1200px;margin:0 auto;}
.section-header{text-align:center;margin-bottom:50px;}
.section-title{font-family:var(--font-display);font-size:clamp(2rem,4vw,2.8rem);color:#1e1b4b;position:relative;display:inline-block;}
.filter-bar{display:flex;justify-content:center;gap:10px;margin-bottom:30px;flex-wrap:wrap;}
.filter-btn{padding:8px 20px;border-radius:99px;border:2px solid var(--purple-pale);background:#fff;color:var(--purple);font-weight:700;cursor:pointer;transition:all 0.3s ease;}
.filter-btn.active{background:var(--purple);color:#fff;border-color:var(--purple);}
.products-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:22px;}
.product-card{background:#fff;border-radius:var(--radius-lg);overflow:hidden;box-shadow:0 4px 20px rgba(124,58,237,.1);border:2px solid #f3f0ff;transition:all .35s ease;cursor:pointer;}
.card-img{position:relative;overflow:hidden;height:220px;background:#f5f3ff;}
.card-img img{width:100%;height:100%;object-fit:contain;}
.card-body{padding:14px;text-align:center;}
.card-name{font-weight:800;font-size:.95rem;color:#1e1b4b;margin-bottom:12px;}
.btn-order{width:100%;display:flex;align-items:center;justify-content:center;gap:7px;background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;font-weight:800;padding:11px;border-radius:var(--radius);border:none;cursor:pointer;}

#footer{background:linear-gradient(135deg,#1e1b4b,#312e81);color:#fff;padding:60px 20px 28px;}
.footer-bottom{border-top:1px solid rgba(255,255,255,0.1);padding-top:22px;text-align:center;color:#a5b4fc;font-size:.82rem;font-weight:600;}

/* --- أزرار التواصل العائمة (موزاة وحركة هادئة) --- */
#wa-fab, #messenger-fab {
  position: fixed; bottom: 24px; z-index: 997; width: 56px; height: 56px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 24px rgba(0,0,0,.2);
  transition: transform .3s ease; animation: breatheM 4s ease-in-out infinite !important;
}
#wa-fab { right: 24px; background: linear-gradient(135deg,#22c55e,#16a34a); }
#messenger-fab { left: 24px; background: #0084FF; }
html[dir=rtl] #wa-fab { right: auto; left: 24px; }
html[dir=rtl] #messenger-fab { left: auto; right: 24px; }
@keyframes breatheM { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }

.modal-backdrop{display:none;position:fixed;inset:0;background:rgba(30,27,75,.65);backdrop-filter:blur(6px);z-index:1000;align-items:center;justify-content:center;}
.modal-backdrop.open{display:flex;}
.modal{background:#fff;border-radius:var(--radius-xl);width:90%;max-width:500px;padding:24px;position:relative;}
@media(max-width:600px){.products-grid{grid-template-columns:repeat(2,1fr);gap:12px;}.card-img{height:180px;}}

<script>
const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQzlArTANRbwpL6_tHgoqQdM5K8hDUuXn6Eb60deWmBt-yHeZo42U46XsoauhF7hSWvKqiuCje1COvY/pub?gid=410786477&single=true&output=csv';
const TR = {
  fr: { navHome: 'Accueil', navProducts: 'Produits', heroT1: 'La Mode pour', heroT2: 'Petits Trésors', heroCta1: 'Découvrir', catTitle: 'Nos Articles', filterAll: 'Tous', filterGirls: 'Filles', filterBoys: 'Garçons', footerRights: 'Tous droits réservés' },
  ar: { navHome: 'الرئيسية', navProducts: 'منتجاتنا', heroT1: 'الموضة لـ', heroT2: 'أصغر الأمراء', heroCta1: 'اكتشف المجموعة', catTitle: 'منتجاتنا', filterAll: 'الكل', filterGirls: 'بنات', filterBoys: 'بنين', footerRights: 'جميع الحقوق محفوظة' }
};

let lang = 'fr', currentFilter = 'all';

async function loadProducts() {
  try {
    const response = await fetch(SHEET_CSV_URL + '&t=' + new Date().getTime());
    const data = await response.text();
    const rows = data.split(/\r?\n/).slice(1);
    let products = rows.map((rowStr, index) => {
      const row = rowStr.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
      if(row.length > 5 && row[1]) {
        return {
          id: index,
          name: row[1].replace(/^"|"$/g, ""),
          cat: row[3].replace(/^"|"$/g, "").toLowerCase(),
          image: (row[11] || row[10] || '').replace(/^"|"$/g, "").trim()
        };
      }
      return null;
    }).filter(p => p);
    localStorage.setItem('kidi-prods', JSON.stringify(products));
    renderProducts();
  } catch (e) { renderProducts(); }
}

function renderProducts() {
  const grid = document.getElementById('products-grid'); if(!grid) return;
  let prods = JSON.parse(localStorage.getItem('kidi-prods') || '[]');
  
  if(currentFilter !== 'all') {
    prods = prods.filter(p => {
      if(currentFilter === 'girls') return p.cat.includes('fille') || p.cat.includes('girl') || p.cat.includes('بنات');
      if(currentFilter === 'boys') return p.cat.includes('garcon') || p.cat.includes('boy') || p.cat.includes('بنين');
      return true;
    });
  }
  
  grid.innerHTML = prods.map(p => `
    <div class="product-card">
      <div class="card-img"><img src="${p.image || 'https://i.postimg.cc/4xBZvJSL/logo.jpg'}" loading="lazy"></div>
      <div class="card-body">
        <div class="card-name">${p.name}</div>
        <button class="btn-order" onclick="window.open('https://wa.me/213553454520','_blank')">Order WhatsApp</button>
      </div>
    </div>
  `).join('');
}

function filterProducts(cat) {
  currentFilter = cat;
  document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
  document.getElementById('btn-filter-' + cat).classList.add('active');
  renderProducts();
}

function setLang(l) {
  lang = l; document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
  applyTR(); renderProducts();
}

function applyTR() {
  const t = TR[lang];
  document.querySelectorAll('[data-tr]').forEach(el => {
    const key = el.getAttribute('data-tr');
    if(t[key]) el.textContent = t[key];
  });
}

function scrollToSection(id) { document.getElementById(id).scrollIntoView({behavior:'smooth'}); }

loadProducts();
</script>
