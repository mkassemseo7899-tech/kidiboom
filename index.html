<style>
:root{--purple:#7C3AED;--purple-light:#A78BFA;--purple-pale:#EDE9FE;--pink:#EC4899;--pink-light:#FBCFE8;--yellow:#FCD34D;--mint:#34D399;--sky:#38BDF8;--green:#22C55E;--green-dark:#16A34A;--bg:#FAF5FF;--white:#fff;--dark:#1E1B4B;--radius:18px;--radius-lg:28px;--radius-xl:40px;--shadow:0 8px 32px rgba(124,58,237,.15);--shadow-hover:0 20px 48px rgba(124,58,237,.28);--font-display:'Fredoka One',cursive;--font-body:'Nunito',sans-serif;}
html[lang=ar]{--font-display:'Tajawal','Cairo',sans-serif;--font-body:'Tajawal','Cairo',sans-serif;}
*{box-sizing:border-box;margin:0;padding:0;}html{scroll-behavior:smooth;}
body{font-family:var(--font-body);background:var(--bg);color:var(--dark);overflow-x:hidden;}
#ticker-bar{background:#ffffff;color:var(--dark);padding:10px 0;overflow:hidden;white-space:nowrap;position:fixed;top:0;left:0;right:0;z-index:1000;border-bottom:2px solid var(--purple-pale);}
.ticker-track{display:inline-flex;gap:0;animation:ticker 28s linear infinite;width:max-content;}
@keyframes ticker{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.ticker-item{display:inline-flex;align-items:center;gap:10px;padding:0 32px;font-weight:800;font-size:.85rem;}

#header{position:fixed;top:42px;left:0;right:0;z-index:999;padding:12px 0;transition:all .3s ease;background:rgba(255,255,255,0.95);backdrop-filter:blur(10px);}
.header-inner{max-width:1200px;margin:0 auto;padding:0 20px;display:flex;align-items:center;justify-content:space-between;}
.logo-icon{width:52px;height:52px;background:#fff;border-radius:14px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(124,58,237,.3);border: 2px solid var(--purple-pale); padding: 2px;}
.logo-icon img {width: 100%; height: 100%; object-fit: contain; border-radius: 12px;}
.logo-text{font-family:var(--font-display);font-size:1.6rem;text-decoration:none;display:flex;gap:5px;}
.logo-text span:first-child{color:var(--purple);}
.logo-text span:last-child{color:var(--pink);}
.lang-switcher{display:flex;background:#ede9fe;border-radius:99px;padding:3px;gap:2px;}
.lang-btn{padding:5px 12px;border-radius:99px;border:none;font-weight:700;cursor:pointer;background:transparent;color:var(--purple);}
.lang-btn.active{background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.1);}

#hero{min-height:100vh;background:linear-gradient(135deg,#f5f3ff 0%,#fdf2f8 50%,#fefce8 100%);display:flex;align-items:center;padding:180px 20px 60px;position:relative;overflow:hidden;}
.hero-inner{max-width:1200px;margin:0 auto;width:100%;display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:center;}
.hero-title{font-family:var(--font-display);font-size:clamp(2.5rem,5vw,4.2rem);line-height:1.1;color:#1e1b4b;}
.btn-primary{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(135deg,var(--purple),var(--pink));color:#fff;font-weight:800;padding:14px 28px;border-radius:var(--radius);text-decoration:none;box-shadow:var(--shadow);}

.section{padding:80px 20px;max-width:1200px;margin:0 auto;}
.filter-bar{display:flex;justify-content:center;gap:10px;margin-bottom:30px;flex-wrap:wrap;}
.filter-btn{padding:8px 20px;border-radius:99px;border:2px solid var(--purple-pale);background:#fff;color:var(--purple);font-weight:700;cursor:pointer;transition:0.3s;}
.filter-btn.active{background:var(--purple);color:#fff;border-color:var(--purple);}
.products-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:22px;}
.product-card{background:#fff;border-radius:var(--radius-lg);overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,0.05);border:2px solid #f3f0ff;transition:0.3s;cursor:pointer;}
.card-img{height:220px;background:#f5f3ff;display:flex;align-items:center;justify-content:center;}
.card-img img{width:100%;height:100%;object-fit:contain;}
.card-body{padding:14px;text-align:center;}
.btn-order{width:100%;display:flex;align-items:center;justify-content:center;gap:7px;background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;font-weight:800;padding:11px;border-radius:var(--radius);border:none;cursor:pointer;margin-top:10px;}

/* Floating Buttons - موازاة وحركة هادئة */
#wa-fab, #messenger-fab {
  position: fixed; bottom: 24px; z-index: 997; width: 56px; height: 56px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 24px rgba(0,0,0,.2);
  transition: transform .3s ease; animation: breatheM 4s ease-in-out infinite !important;
}
#wa-fab { right: 24px; background: linear-gradient(135deg,#22c55e,#16a34a); }
#messenger-fab { left: 24px; background: #0084FF; }
html[dir=rtl] #wa-fab { right: auto; left: 24px; }
html[dir=rtl] #messenger-fab { left: auto; right: 24px; }
@keyframes breatheM { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }

#footer{background:var(--dark);color:#fff;padding:60px 20px 28px;text-align:center;}
.footer-bottom{border-top:1px solid rgba(255,255,255,0.1);padding-top:22px;color:#a5b4fc;font-weight:600;}

/* Modal */
.modal-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(5px);z-index:2000;align-items:center;justify-content:center;padding:20px;}
.modal-backdrop.open{display:flex;}
.modal{background:#fff;border-radius:var(--radius-xl);width:100%;max-width:500px;overflow:hidden;position:relative;}
.modal-img{height:300px;background:#f9f9f9;display:flex;align-items:center;justify-content:center;}
.modal-img img{width:100%;height:100%;object-fit:contain;}
.modal-body{padding:20px;text-align:center;}
.modal-close{position:absolute;top:15px;right:15px;background:#fff;border-radius:50%;width:30px;height:30px;border:none;cursor:pointer;font-weight:bold;z-index:10;}

@media(max-width:900px){.hero-inner{grid-template-columns:1fr;text-align:center;}.products-grid{grid-template-columns:repeat(2,1fr);gap:12px;}}
</style>

      <button class="btn-order" onclick="orderProduct()">WhatsApp Order</button>
    </div>
  </div>

<script>
const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQzlArTANRbwpL6_tHgoqQdM5K8hDUuXn6Eb60deWmBt-yHeZo42U46XsoauhF7hSWvKqiuCje1COvY/pub?gid=410786477&single=true&output=csv';
const TR = {
  fr: { heroT1:'La Mode pour', heroT2:'Petits Trésors', heroCta1:'Découvrir', catTitle:'Nos Articles', filterAll:'Tous', filterGirls:'Filles', filterBoys:'Garçons', footerRights:'Tous droits réservés' },
  ar: { heroT1:'الموضة لـ', heroT2:'أصغر الأمراء', heroCta1:'اكتشف المجموعة', catTitle:'منتجاتنا', filterAll:'الكل', filterGirls:'بنات', filterBoys:'بنين', footerRights:'جميع الحقوق محفوظة' }
};

let lang = 'fr', currentFilter = 'all', allProducts = [];

async function loadProducts() {
  try {
    const res = await fetch(SHEET_URL + '&t=' + new Date().getTime());
    const data = await res.text();
    const rows = data.split(/\r?\n/).slice(1);
    allProducts = rows.map((r, i) => {
      const c = r.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
      if (c.length < 5) return null;
      return { 
        id: i, name: c[1]?.replace(/"/g,''), nameAr: c[2]?.replace(/"/g,''),
        cat: c[3]?.replace(/"/g,'').toLowerCase(),
        desc: c[5]?.replace(/"/g,''), descAr: c[6]?.replace(/"/g,''),
        img: (c[11] || c[10] || '').replace(/"/g,'').trim() 
      };
    }).filter(p => p && p.name);
    renderProducts();
  } catch(e) { console.error(e); }
}

function renderProducts() {
  const grid = document.getElementById('products-grid');
  let filtered = allProducts;
  if(currentFilter === 'girls') filtered = allProducts.filter(p => p.cat.includes('fille') || p.cat.includes('girl') || p.cat.includes('بنات'));
  if(currentFilter === 'boys') filtered = allProducts.filter(p => p.cat.includes('garcon') || p.cat.includes('boy') || p.cat.includes('بنين'));
  
  grid.innerHTML = filtered.map((p, i) => `
    <div class="product-card" onclick="openModal(${i})">
      <div class="card-img"><img src="${p.img || 'https://i.postimg.cc/4xBZvJSL/logo.jpg'}" loading="lazy"></div>
      <div class="card-body">
        <div class="card-name">${lang==='ar'?p.nameAr:p.name}</div>
        <button class="btn-order">Order</button>
      </div>
    </div>`).join('');
}

let selectedProd = null;
function openModal(idx) {
  selectedProd = allProducts[idx];
  document.getElementById('modal-name').textContent = lang==='ar'?selectedProd.nameAr:selectedProd.name;
  document.getElementById('modal-desc').textContent = lang==='ar'?selectedProd.descAr:selectedProd.desc;
  document.getElementById('modal-img').innerHTML = `<img src="${selectedProd.img}">`;
  document.getElementById('modal').classList.add('open');
}
function closeModal() { document.getElementById('modal').classList.remove('open'); }
function orderProduct() { window.open(`https://wa.me/213553454520?text=Order: ${selectedProd.name}`,'_blank'); }

function filterProducts(c) {
  currentFilter = c;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-' + c).classList.add('active');
  renderProducts();
}

function setLang(l) {
  lang = l; document.documentElement.dir = l==='ar'?'rtl':'ltr';
  document.getElementById('btn-fr').classList.toggle('active', l==='fr');
  document.getElementById('btn-ar').classList.toggle('active', l==='ar');
  const t = TR[l];
  document.querySelectorAll('[data-tr]').forEach(el => el.textContent = t[el.getAttribute('data-tr')]);
  renderProducts();
}

loadProducts();
</script>
